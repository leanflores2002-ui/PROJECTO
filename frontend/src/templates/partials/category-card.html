<article class="product-card romix-product-card">
  <a class="product-thumb" href="%%DETAIL%%" aria-label="Ver %%NAME%%">
    <img src="%%IMAGE%%" alt="%%NAME%%" width="720" height="960" loading="lazy" decoding="async" />
  </a>
  <div class="product-body">
    <div class="product-variant-thumbs" aria-label="Variantes fotográficas">%%VARIANTS%%</div>
    <a class="product-name" href="%%DETAIL%%">%%NAME%%</a>
    <div class="price-row"><p class="product-price">%%PRICE%%</p></div>
    <a class="catalog-cta romix-btn romix-btn--outline romix-btn--sm" href="%%DETAIL%%">Ver producto</a>
  </div>
</article>
