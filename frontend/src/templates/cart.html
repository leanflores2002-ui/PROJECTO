  <style>
    :root { --primary:#e83e8c; --secondary:#6f42c1; --success:#28a745; --danger:#dc3545; --light:#f8f9fa; --dark:#343a40; --radius:10px; }
    * { box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin:0; background:#f5f5f5; color:#232323; }
    header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:14px 0 10px; box-shadow: none; position: sticky; top: 0; z-index: 1000; }
    .header-container { max-width:1600px; margin:0 auto; padding:0 28px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:16px; }
    .logo { font-size:1.8rem; font-weight:800; display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; letter-spacing:-0.5px; }
    .logo .logo-mark { width:40px; height:40px; object-fit:contain; display:block; }
    .global-search { display:flex; align-items:center; gap:0; position:relative; max-width:740px; width:100%; margin:0 auto; }
    .global-search input[type="search"] { padding:10px 14px; border:1px solid rgba(255,255,255,.45); border-radius:999px 0 0 999px; min-width:320px; color:#111; background:#fff; caret-color: var(--secondary); width:100%; }
    .global-search input[type="search"]::placeholder { color:#6c757d; }
    .global-search input[type="search"]::selection { background:#ffe0f0; color:#111; }
    .global-search button { padding:10px 16px; border-radius:0 999px 999px 0; border:1px solid rgba(255,255,255,.45); background:#fff; color:var(--primary); cursor:pointer; font-weight:800; }
    .topbar-icons { display:flex; align-items:center; gap:12px; }
    .icon-btn { width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; position:relative; }
    .icon-badge { position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; border-radius:999px; font-size:.7rem; padding:2px 6px; }
    .nav-secondary { max-width:1600px; margin:8px auto 0; padding:0 28px 10px; display:flex; gap:14px; align-items:center; flex-wrap:nowrap; overflow-x:auto; color:#fff; font-weight:700; scrollbar-width:none; }
    .nav-secondary a { color:#fff; text-decoration:none; padding:10px 12px; border-radius: var(--romix-radius); transition:background .2s ease, color .2s ease; }
    .nav-secondary a:hover { background:rgba(255,255,255,.12); }
    .cat-pill { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35); padding:8px 12px; border-radius:999px; font-weight:700; text-decoration:none; font-size:.95rem; }

    .container { max-width:1600px; margin:22px auto; padding:0 28px; }
    .cart-page { text-align:center; padding-bottom:48px; }
    .cart-title { font-size: 1.8rem; font-weight: 900; color: #1b1f24; margin: 6px 0; }
    .cart-subtitle { color:#6c757d; margin-bottom:14px; }
    .cart-box { max-width: 1240px; margin: 0 auto; background:#fff; border-radius: var(--romix-radius); box-shadow: none; padding: 22px; min-height:160px; }
    .cart-list { display:flex; flex-direction:column; gap:12px; }
    .cart-item { display:grid; grid-template-columns: 86px 1fr auto; gap:14px; align-items:center; border:1px solid #e9ecef; border-radius: var(--romix-radius); padding:10px; }
    .cart-thumb { width:86px; height:86px; background:#f8f9fb; border-radius: var(--romix-radius); overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .cart-thumb img { width:100%; height:100%; object-fit:contain; }
    .cart-info { text-align:left; }
    .cart-info .name { font-weight:900; color:#111; }
    .cart-info .meta { color:#6c757d; font-size:.95rem; }
    .cart-info .unit { color: var(--secondary); font-weight:800; font-size:1rem; }
    .qty-stepper { display:inline-flex; align-items:center; gap:8px; border:1px solid #dee2e6; border-radius: var(--romix-radius); padding:4px 6px; background:#fff; margin-top:6px; }
    .qty-stepper button { width:28px; height:28px; border-radius: var(--romix-radius); border:1px solid #dee2e6; background:#fff; cursor:pointer; }
    .qty-stepper input { width:48px; text-align:center; border:none; outline:none; }
    .cart-right { text-align:right; }
    .cart-right .subtotal { font-weight:900; color:#1b1f24; }
    .cart-right .remove { color:#dc3545; background:#fff; border:1px solid #f1a6ad; border-radius: var(--romix-radius); padding:6px 8px; cursor:pointer; }
    .cart-summary { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:12px; border-top:1px solid #e9ecef; }
    .cart-summary .left { text-align:left; color:#6c757d; }
    .cart-actions-row { margin-top:12px; display:flex; gap:10px; justify-content:flex-end; }
    .btn { padding:10px 16px; border-radius: var(--romix-radius); border:1px solid #e9ecef; background:#fff; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; }
    .btn-outline { background:#fff; color:#495057; }
    .link-danger { background:none; border:none; color:#dc3545; cursor:pointer; text-decoration:underline; }
    .cart-alert { display:flex; align-items:center; gap:8px; padding:10px 14px; margin-bottom:18px; border-radius: var(--romix-radius); font-weight:700; }
    .cart-alert--error { background:#ffe9ea; border:1px solid #f5a2ab; color:#a10e1d; }
    .cart-alert--info { background:#e6f0ff; border:1px solid #7aa7ff; color:#0b3d91; }
    .cart-empty-state { color:#6c757d; font-weight:700; }
    .post-order-state { border:1px dashed #e9ecef; border-radius: var(--romix-radius); padding:20px; background:#fffdfb; display:flex; flex-direction:column; gap:14px; }
    .post-order-state__details { display:flex; align-items:center; gap:12px; }
    .post-order-state__icon { font-size:1.8rem; color:var(--success); }
    .post-order-state__title { font-size:1.2rem; font-weight:800; margin:0; color:#111; }
    .post-order-state__subtitle { margin:4px 0 0; color:#6c757d; font-size:.95rem; }
    .post-order-state__action { align-self:flex-start; }
    /* Sugerencias buscador */
    .search-suggestions { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ddd; border-radius: var(--romix-radius); box-shadow: none; padding:6px 0; z-index:2001; }
    .search-suggestion { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; color:#212529; }
    .search-suggestion .t { color:#212529; }
    .search-suggestion small { color:#6c757d; }
    .search-suggestion:hover, .search-suggestion.active { background:#f1f3f5; }
  </style>

  <style>
    :root {
      --rose-50: #fff8fc;
      --rose-100: #ffeff8;
      --rose-200: #ffd9ec;
      --rose-500: #f05aa8;
      --rose-600: #db3b92;
      --ink-900: #312b37;
      --ink-700: #60556a;
      --ink-500: #8a7f95;
      --line-soft: #efe6f2;
      --glass-bg: rgba(255, 255, 255, 0.76);
      --glass-border: rgba(255, 255, 255, 0.92);
      --shadow-soft: 0 22px 56px rgba(219, 97, 166, 0.14);
      --shadow-card: 0 12px 28px rgba(224, 177, 210, 0.26);
    }

    body {
      font-family: 'Manrope', 'Nunito Sans', sans-serif;
      color: var(--ink-900);
      background:
        radial-gradient(1150px 700px at -8% 0%, rgba(255, 223, 241, 0.72), transparent 60%),
        radial-gradient(980px 680px at 108% 10%, rgba(255, 237, 247, 0.62), transparent 62%),
        linear-gradient(158deg, #fff8fd 0%, #fff 46%, #fff6fc 100%);
      min-height: 100vh;
    }

    .cart-container {
      width: min(100%, 1240px);
      margin: 18px auto 54px;
      padding: 0 14px;
    }

    .cart-page {
      text-align: left;
      padding-bottom: 8px;
    }

    .checkout-steps {
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .checkout-steps::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .checkout-steps li {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #978aa3;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid #f1e8f4;
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: none;
    }

    .checkout-steps li:not(:last-child)::after {
      content: '>';
      color: #c9bdd2;
      font-weight: 800;
      margin-left: 1px;
    }

    .checkout-steps li.is-active {
      color: #fff;
      background: linear-gradient(135deg, #f476bb 0%, #d93a94 100%);
      border-color: transparent;
      box-shadow: none;
    }

    .checkout-steps li.is-active::after {
      color: rgba(255, 255, 255, 0.88);
    }

    .cart-title {
      margin: 0;
      font-size: clamp(1.48rem, 5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink-900);
    }

    .cart-subtitle {
      margin: 6px 0 18px;
      color: var(--ink-500);
      font-size: 0.95rem;
    }

    .cart-box {
      max-width: none;
      margin: 0;
      min-height: 0;
      padding: 16px;
      border-radius: var(--romix-radius);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      box-shadow: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .cart-alert {
      margin-bottom: 14px;
      border-radius: var(--romix-radius);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .cart-products-col {
      min-width: 0;
    }

    .cart-items-title {
      margin: 4px 0 14px;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #6a5f76;
    }

    .cart-list {
      gap: 12px;
    }

    .cart-item {
      border: 1px solid #f1e8f4;
      border-radius: var(--romix-radius);
      padding: 14px;
      background: #fff;
      box-shadow: none;
      display: grid;
      grid-template-columns: 24px 82px 1fr;
      grid-template-areas:
        'check thumb info'
        '. . right';
      gap: 12px;
      align-items: start;
    }

    .item-check {
      grid-area: check;
      padding-top: 4px;
      display: flex;
      justify-content: center;
    }

    .item-check .item-select {
      width: 18px;
      height: 18px;
      accent-color: var(--rose-600);
      cursor: pointer;
    }

    .cart-thumb {
      grid-area: thumb;
      width: 82px;
      height: 92px;
      border-radius: var(--romix-radius);
      border: 1px solid #f3eaf5;
      background: #fff9fd;
      box-shadow: none;
    }

    .cart-info {
      grid-area: info;
      text-align: left;
      min-width: 0;
    }

    .cart-info .brand {
      font-size: 0.74rem;
      color: #987f96;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .cart-info .name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink-900);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .cart-info .meta {
      color: var(--ink-700);
      font-size: 0.87rem;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .unit-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cart-info .unit {
      color: #d53790;
      font-weight: 800;
      font-size: 1.02rem;
    }

    .cart-info .unit-old {
      color: #b9aebf;
      text-decoration: line-through;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .cart-info .unit-discount {
      border-radius: 999px;
      padding: 3px 8px;
      background: #ffe7f5;
      border: 1px solid #ffcce8;
      color: #c13081;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .cart-right {
      grid-area: right;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .qty-stepper {
      margin-top: 0;
      border: 1px solid #efd9e9;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      box-shadow: none;
    }

    .qty-stepper button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 999px;
      background: var(--romix-pink-readable);
      color: #fff;
      font-weight: 800;
      box-shadow: none;
    }

    .qty-stepper input {
      width: 44px;
      color: var(--ink-900);
      font-size: 0.95rem;
      font-weight: 700;
      background: transparent;
    }

    .cart-right .subtotal {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--rose-600);
      letter-spacing: -0.01em;
    }

    .cart-right .remove {
      color: var(--rose-600);
      border: 1px solid #ffd0eb;
      background: #fff4fb;
      border-radius: var(--romix-radius);
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cart-right .remove svg { width: 18px; height: 18px; }

    .cart-summary-col {
      min-width: 0;
    }

    .cart-summary {
      margin-top: 0;
      border-top: none;
      display: block;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: var(--romix-radius);
      padding: 16px;
      box-shadow: none;
    }

    .cart-summary .left {
      text-align: left;
      color: var(--ink-700);
    }

    .summary-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      color: #4e4458;
      letter-spacing: -0.01em;
    }

    .summary-thumbs {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      flex-wrap: wrap;
    }

    .summary-thumb {
      width: 40px;
      height: 40px;
      border-radius: var(--romix-radius);
      border: 1px solid #f3e7f2;
      object-fit: cover;
      background: #fff8fd;
      box-shadow: none;
    }

    .summary-thumb-empty {
      color: #6F6D76;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .summary-thumb-more {
      font-size: 0.78rem;
      font-weight: 800;
      color: #a04f89;
      border: 1px solid #f2d7e8;
      background: #fff4fb;
      border-radius: 999px;
      padding: 6px 10px;
    }

    .summary-metric {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
      color: #776d83;
      font-size: 0.94rem;
    }

    .summary-metric span {
      color: #4f4459;
      font-weight: 800;
    }

    .link-danger {
      margin-top: 8px;
      color: #c14285;
      text-decoration: none;
      border-bottom: 1px solid rgba(193, 66, 133, 0.35);
      padding: 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .cart-actions-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      justify-content: stretch;
    }

    .btn {
      min-height: 50px;
      width: 100%;
      border-radius: var(--romix-radius);
      border: 1px solid #eedee9;
      font-size: 0.95rem;
      font-weight: 800;
      justify-content: center;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-outline {
      color: #6b6076;
      background: #fff;
      box-shadow: none;
    }

    .btn-primary {
      border: none;
      color: #fff;
      background: var(--romix-pink-readable);
      box-shadow: none;
    }

    .cart-empty-state {
      border: 1px dashed #ecdbe8;
      border-radius: var(--romix-radius);
      padding: 22px;
      background: #fff;
      color: #6F6D76;
      text-align: center;
    }

    .post-order-state {
      border: 1px dashed #eedfed;
      border-radius: var(--romix-radius);
      background: #fff;
      padding: 18px;
      box-shadow: none;
    }

    .post-order-state__icon {
      color: #6cb392;
    }

    @media (max-width: 640px) {
      .cart-container {
        margin-top: 12px;
        margin-bottom: 36px;
        padding: 0 10px;
      }

      .checkout-steps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        overflow: visible;
        white-space: normal;
      }

      .checkout-steps li {
        justify-content: center;
        font-size: 0.74rem;
        padding: 8px 10px;
        text-align: center;
      }

      .checkout-steps li::after {
        display: none;
      }

      .cart-title {
        font-size: 1.42rem;
      }

      .cart-subtitle {
        margin-bottom: 14px;
        font-size: 0.9rem;
      }

      .cart-box {
        border-radius: var(--romix-radius);
        padding: 12px;
      }

      .cart-items-title {
        margin-bottom: 10px;
        font-size: 0.82rem;
      }

      .cart-item {
        border-radius: var(--romix-radius);
        grid-template-columns: 20px 74px minmax(0, 1fr);
        grid-template-areas:
          'check thumb info'
          'right right right';
        gap: 10px;
        padding: 12px;
      }

      .item-check {
        padding-top: 2px;
      }

      .cart-thumb {
        width: 74px;
        height: 84px;
        border-radius: var(--romix-radius);
      }

      .cart-info .brand {
        font-size: 0.68rem;
      }

      .cart-info .name {
        font-size: 0.93rem;
      }

      .cart-info .meta {
        font-size: 0.81rem;
        margin-bottom: 6px;
      }

      .cart-info .unit {
        font-size: 0.92rem;
      }

      .cart-right {
        width: 100%;
        border-top: 1px solid #f1e6ef;
        padding-top: 10px;
        justify-content: space-between;
      }

      .qty-stepper {
        padding: 4px;
      }

      .qty-stepper button {
        width: 34px;
        height: 34px;
        font-size: 1.05rem;
      }

      .qty-stepper input {
        width: 52px;
        font-size: 0.93rem;
      }

      .cart-right .subtotal {
        font-size: 1.05rem;
      }

      .cart-right .remove {
        width: 38px;
        height: 38px;
      }

      .cart-summary {
        border-radius: var(--romix-radius);
        padding: 14px;
      }

      .summary-title {
        font-size: 1rem;
      }

      .summary-thumb {
        width: 36px;
        height: 36px;
      }

      .summary-metric {
        margin-top: 10px;
        padding-top: 10px;
        font-size: 0.9rem;
      }

      .cart-actions-row {
        margin-top: 12px;
        gap: 8px;
      }

      .btn {
        min-height: 48px;
        border-radius: var(--romix-radius);
        font-size: 0.92rem;
      }
    }

    @media (min-width: 760px) {
      .cart-container {
        padding: 0 20px;
      }

      .cart-box {
        padding: 22px;
      }
    }

    @media (min-width: 980px) {
      .cart-container {
        margin-top: 24px;
        padding: 0 28px;
      }

      .cart-layout {
        grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.75fr);
        gap: 22px;
        align-items: start;
      }

      .cart-summary-col {
        position: sticky;
        top: 94px;
      }

      .cart-item {
        grid-template-columns: 24px 88px minmax(0, 1fr) auto;
        grid-template-areas: 'check thumb info right';
        align-items: center;
      }

      .cart-thumb {
        width: 88px;
        height: 96px;
      }

      .cart-right {
        justify-content: flex-end;
        min-width: 250px;
      }
    }

</head>
<body>
<!-- ROMIX:INCLUDE:HEADER -->

  <div class="container cart-container">
    <div class="cart-page">
      <h1 class="cart-title">Mi Carrito</h1>
      <p class="cart-subtitle">Revisa tus productos seleccionados</p>
      <div class="cart-box">
        <div id="cart-alert" class="cart-alert" role="alert" hidden></div>
        <div class="cart-layout">
          <section class="cart-products-col" aria-label="Articulos en carrito">
            <h2 class="cart-items-title">TODOS LOS ARTICULOS (<span id="cart-items-title-count">0</span>)</h2>
            <div id="cart-list" class="cart-list"></div>
          </section>
          <aside class="cart-summary-col" aria-label="Resumen del pedido">
            <div class="cart-summary">
              <div class="left">
                <h3 class="summary-title">Resumen del pedido</h3>
                <div id="cart-summary-thumbs" class="summary-thumbs"></div>
                <div class="summary-metric">Total de productos: <span id="cart-count-display">0</span></div>
                <button id="cart-clear-btn" type="button" class="link-danger romix-btn romix-btn--danger romix-btn--sm"><span data-romix-icon="Trash2" data-romix-icon-size="sm"></span><span>Vaciar carrito</span></button>
              </div>
              <div class="cart-actions-row">
                <a class="btn btn-outline romix-btn romix-btn--secondary" href="index.html"><span data-romix-icon="ArrowLeft" data-romix-icon-size="sm"></span><span>Continuar comprando</span></a>
                <button class="btn btn-primary romix-btn romix-btn--primary romix-btn--lg" type="button" id="order-btn"><span data-romix-icon="MessageCircle" data-romix-icon-size="md"></span><span>Enviar pedido</span></button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>
<!-- ROMIX:INCLUDE:FOOTER -->
  <script src="assets/js/romix-image-utils.js?v=21"></script>
    <script src="assets/js/color-utils.js?v=19"></script>
  <script src="assets/js/cart.js?v=20"></script>
  <script>
    // Correccion basica de textos mal decodificados
    (function(){
      const map = [
        ['Cat+?-?logo','Catalogo'],
        ['M+?-?s','Mas'],
        ['m+?-?s','mas'],
        ['Colecci+?-?n','Coleccion'],
        ['Ni+?-?os','Ninos']
      ];
      function fixText(s){
        if(!s||typeof s!=='string') return s;
        let o=s; map.forEach(([a,b])=>{ o=o.split(a).join(b); });
        return o;
      }
      function fixUtf8(s){
        if (!s || typeof s !== 'string') return s;
        try {
          const decoded = decodeURIComponent(escape(s));
          return decoded || s;
        } catch {
          return s;
        }
      }
      function fixAll(){ try{ const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null); const ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(n=> { const fx=fixUtf8(fixText(n.nodeValue)); if(fx&&fx!==n.nodeValue) n.nodeValue=fx; }); }catch{} }
      document.addEventListener('DOMContentLoaded', fixAll);
    })();


    const COLOR_FALLBACK = 'Negro';
    const WA_NUMBER = '5491154272065';
    const colorUtils = typeof window.romixColorUtils === 'object' ? window.romixColorUtils : {};
    const normalizeCartColorName = typeof colorUtils.normalizeColorName === 'function'
      ? colorUtils.normalizeColorName
      : (value) => (value || '').toString().trim();

    const CART_ALERT_ID = 'cart-alert';
    const POST_ORDER_MESSAGE = 'Pedido enviado correctamente';
    const POST_ORDER_SUBTITLE = 'La disponibilidad de los productos esta sujeta a stock al momento de la confirmacion por parte del vendedor.';
    const POST_ORDER_BUTTON_LABEL = 'Seguir comprando';
    const CART_IMAGE_PLACEHOLDER = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="100%" height="100%" fill="#fff8fd"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#b79ab0" font-family="Segoe UI, Arial" font-size="16">ROMIX</text></svg>')}`;
    let orderStatus = null;
    let orderInProgress = false;
    let inventoryLoading = true;

    function decodeCartValue(value) {
      if (value == null) return '';
      const text = String(value);
      if (typeof window.decodeURIComponent === 'function') {
        try {
          return decodeURIComponent(escape(text));
        } catch {}
      }
      return text;
    }

    function getCartDisplayItem(item) {
      if (!item || typeof item !== 'object') {
        return { name: '', type: '', color: '', size: '' };
      }
      const rawColor = decodeCartValue(item.colorName || item.color);
      const normalizedColor = normalizeCartColorName(rawColor);
      return {
        name: decodeCartValue(item.name),
        type: decodeCartValue(item.type),
        color: normalizedColor || COLOR_FALLBACK,
        size: decodeCartValue(item.size || item.talle),
      };
    }

    function getImageSourcesForItem(item) {
      const rawImage = item && item.image ? String(item.image).trim() : '';
      if (!rawImage) return [];
      if (window.romixImageUtils && typeof window.romixImageUtils.getImageFallbackSources === 'function') {
        return window.romixImageUtils.getImageFallbackSources(rawImage);
      }
      return [rawImage];
    }

    function findImageForItem(item){
      const sources = getImageSourcesForItem(item);
      return sources[0] || '';
    }

    function applyCartImage(img, item, altText) {
      if (!img) return;
      const sources = getImageSourcesForItem(item);
      if (window.romixImageUtils && typeof window.romixImageUtils.applyImageWithFallback === 'function') {
        window.romixImageUtils.applyImageWithFallback(img, sources, altText, {
          placeholder: CART_IMAGE_PLACEHOLDER
        });
        return;
      }
      img.alt = altText || 'Producto ROMIX';
      img.onerror = () => {
        img.onerror = null;
        img.src = CART_IMAGE_PLACEHOLDER;
      };
      img.src = sources[0] || CART_IMAGE_PLACEHOLDER;
    }

    function showCartAlert(type, message) {
      const alertEl = document.getElementById(CART_ALERT_ID);
      if (!alertEl) return;
      alertEl.textContent = message || '';
      alertEl.hidden = false;
      alertEl.classList.remove('cart-alert--error', 'cart-alert--info');
      alertEl.classList.add(`cart-alert--${type}`);
    }

    function hideCartAlert() {
      const alertEl = document.getElementById(CART_ALERT_ID);
      if (!alertEl) return;
      alertEl.hidden = true;
      alertEl.textContent = '';
      alertEl.classList.remove('cart-alert--error', 'cart-alert--info');
    }

    function removeCartStorage() {
      if (!window.romixCart || !window.romixCart.STORAGE_KEY) return;
      try {
        localStorage.removeItem(window.romixCart.STORAGE_KEY);
      } catch {}
    }

    function renderSuccessState() {
      return `
        <div class="post-order-state" role="status" aria-live="polite">
          <div class="post-order-state__details">
            <span class="post-order-state__icon" aria-hidden="true">${window.romixIcon("Check", { size: "md" })}</span>
            <div>
              <p class="post-order-state__title">${POST_ORDER_MESSAGE}</p>
              <p class="post-order-state__subtitle">${POST_ORDER_SUBTITLE}</p>
            </div>
          </div>
          <a class="btn btn-outline romix-btn romix-btn--secondary post-order-state__action" href="index.html">${POST_ORDER_BUTTON_LABEL}</a>
        </div>`;
    }

    function buildVariantLabel(item) {
      const display = getCartDisplayItem(item);
      const parts = [display.name || 'Producto', display.color || COLOR_FALLBACK, display.size || 'U'];
      return parts.filter(Boolean).join(' / ');
    }

    function handleQty(key, qty){
      window.romixCart.updateQty(key, qty);
      renderCart();
      window.romixCart.updateBadge();
    }

    function handleRemove(key){
      window.romixCart.removeFromCart(key);
      renderCart();
      window.romixCart.updateBadge();
    }

    function handleClear(){
      orderStatus = null;
      hideCartAlert();
      window.romixCart.clearCart();
      removeCartStorage();
      window.romixCart.updateBadge();
      renderCart();
    }

    function validateCartStock(cart) {
      const inventory = window.romixInventory;
      if (!inventory || typeof inventory.getStock !== 'function') {
        return { valid: true, errors: [], warnings: ['La disponibilidad se confirmara por WhatsApp.'] };
      }
      const plan = [];
      const errors = [];
      const warnings = [];
      cart.forEach((item) => {
        const qty = Math.max(1, Number(item.qty ?? item.quantity) || 1);
        const display = getCartDisplayItem(item);
        const color = display.color || COLOR_FALLBACK;
        const size = display.size || 'U';
        const stock = inventory.getStock(item.productId, color, size);
        const label = buildVariantLabel(item);
        const numericStock = Number(stock);
        if (stock === null || stock === "unknown" || Number.isNaN(numericStock)) {
          warnings.push(`La disponibilidad de ${label} se confirmara por WhatsApp.`);
          return;
        }
        if (numericStock <= 0) {
          errors.push(`No hay stock disponible de ${label}.`);
          return;
        }
        if (numericStock < qty) {
          errors.push(`Quedan ${numericStock} unidades de ${label} y pediste ${qty}.`);
          return;
        }
        plan.push({ productId: item.productId, color, size, qty });
      });
      return { valid: errors.length === 0, errors, warnings, plan };
    }
    function finalizeOrder() {
      orderStatus = 'success';
      hideCartAlert();
      window.romixCart.clearCart({ forOrder: true });
      removeCartStorage();
      window.romixCart.updateBadge();
      renderCart();
    }

    function handleOrder(){
      if (orderStatus === 'success' || orderInProgress) return;
      if (inventoryLoading) {
        showCartAlert('info', 'Estamos verificando disponibilidad. Intenta nuevamente en un momento.');
        return;
      }
      const cart = window.romixCart.getCart();
      if (!cart.length) {
        showCartAlert('error', 'Tu carrito esta vacio.');
        return;
      }
      const orderBtn = document.getElementById('order-btn');
      orderInProgress = true;
      if (orderBtn) orderBtn.disabled = true;
      hideCartAlert();
      const validation = validateCartStock(cart);
      if (!validation.valid && validation.errors.length) {
        showCartAlert('error', validation.errors[0]);
        orderInProgress = false;
        if (orderBtn) orderBtn.disabled = false;
        return;
      }
      if (validation.warnings && validation.warnings.length) {
        showCartAlert('info', validation.warnings[0]);
      }
      const message = window.romixCart.buildWhatsAppMessage(cart);
      if (!message) {
        showCartAlert('error', 'No se pudo generar el pedido.');
        orderInProgress = false;
        if (orderBtn) orderBtn.disabled = false;
        return;
      }
      if (window.romixAnalytics) window.romixAnalytics.trackCheckout(cart);
      let orderWindow;
      try {
        orderWindow = window.open('about:blank', '_blank');
        if (orderWindow) {
          orderWindow.opener = null;
          orderWindow.location.href = `https://wa.me/${WA_NUMBER}?text=${message}`;
        }
      } catch {
        try { if (orderWindow) orderWindow.close(); } catch { /* Browser may deny access. */ }
        if (window.romixAnalytics) window.romixAnalytics.trackCheckoutFailure('open_error');
        showCartAlert('error', 'No se pudo abrir WhatsApp. Intenta nuevamente.');
        orderInProgress = false;
        if (orderBtn) orderBtn.disabled = false;
        return;
      }
      if (!orderWindow) {
        if (window.romixAnalytics) window.romixAnalytics.trackCheckoutFailure('popup_blocked');
        showCartAlert('error', 'El navegador bloqueo la apertura de WhatsApp. Habilita las ventanas emergentes e intenta nuevamente.');
        orderInProgress = false;
        if (orderBtn) orderBtn.disabled = false;
        return;
      }
      if (window.romixAnalytics) window.romixAnalytics.trackWhatsApp(cart);
      finalizeOrder();
      orderInProgress = false;
    }
    window.orderCartWhatsApp = handleOrder;
    function renderCart(){
      const cart = window.romixCart.getCart();
      window.romixViewedCart = cart;
      window.dispatchEvent(new CustomEvent('romix:analytics-cart-viewed', { detail: { items: cart } }));
      const list = document.getElementById('cart-list');
      const countDisplay = document.getElementById('cart-count-display');
      const itemsTitleCount = document.getElementById('cart-items-title-count');
      const summaryThumbs = document.getElementById('cart-summary-thumbs');
      const badge = document.getElementById('cart-count');
      const orderBtn = document.getElementById('order-btn');
      const clearBtn = document.getElementById('cart-clear-btn');
      const { totalItems } = window.romixCart.getCartTotals(cart);

      if (countDisplay) countDisplay.textContent = String(totalItems);
      if (itemsTitleCount) itemsTitleCount.textContent = String(cart.length);
      if (badge) badge.textContent = String(totalItems);
      if (summaryThumbs) {
        if (cart.length) {
          const thumbs = cart.slice(0, 4).map((item) => {
            const thumbSrc = findImageForItem(item);
            const label = getCartDisplayItem(item).name || 'Producto';
            return thumbSrc
              ? `<img class="summary-thumb" src="${thumbSrc}" alt="${label}" />`
              : `<span class="summary-thumb summary-thumb-empty" role="img" aria-label="${label}">-</span>`;
          }).join('');
          const more = cart.length > 4 ? `<span class="summary-thumb-more">+${cart.length - 4}</span>` : '';
          summaryThumbs.innerHTML = thumbs + more;
          Array.from(summaryThumbs.querySelectorAll('img.summary-thumb')).forEach((imgEl, index) => {
            applyCartImage(imgEl, cart[index], imgEl.alt || 'Producto');
          });
        } else {
          summaryThumbs.innerHTML = '<span class="summary-thumb-empty">Sin productos.</span>';
        }
      }

      list.innerHTML = '';
      if (cart.length) {
        orderStatus = null;
        cart.forEach((item) => {
          const img = findImageForItem(item);
          const displayItem = getCartDisplayItem(item);
          const key = item.key;
          const qty = Math.max(1, Number(item.qty || item.quantity) || 1);
          const unitPrice = Number(item.price || 0);
          const subtotal = Number(item.subtotal || (qty * unitPrice));
          const originalPrice = Number(item.originalPrice || item.priceOriginal || item.compareAtPrice || 0);
          const hasDiscount = originalPrice > unitPrice;
          const discountPct = hasDiscount ? Math.max(1, Math.round(((originalPrice - unitPrice) / originalPrice) * 100)) : 0;
          const typeLabelRaw = (displayItem.type || 'Producto').toString().trim();
          const typeLabel = typeLabelRaw ? `${typeLabelRaw.charAt(0).toUpperCase()}${typeLabelRaw.slice(1)}` : 'Producto';

          const el = document.createElement('div');
          el.className = 'cart-item';
          el.innerHTML = `
            <div class="item-check">
              <input class="item-select" type="checkbox" checked aria-label="Producto seleccionado" />
            </div>
            <div class="cart-thumb">${img ? `<img src="${img}" alt="${displayItem.name}">` : '<span style="color:#a99cb2;font-weight:700;">Sin imagen</span>'}</div>
            <div class="cart-info">
              <div class="brand">${typeLabel}</div>
              <div class="name">${displayItem.name}</div>
              <div class="meta">Color: ${displayItem.color} | Talle: ${displayItem.size || COLOR_FALLBACK}</div>
              <div class="unit-line">
                <span class="unit">$${unitPrice.toLocaleString('es-AR')} c/u</span>
                ${hasDiscount ? `<span class="unit-old">$${originalPrice.toLocaleString('es-AR')}</span>` : ''}
                ${hasDiscount ? `<span class="unit-discount">-${discountPct}%</span>` : ''}
              </div>
            </div>
            <div class="cart-right">
              <div class="qty-stepper" data-key="${key}">
                <button type="button" class="romix-icon-btn dec" aria-label="Disminuir">${window.romixIcon("Minus", { size: "sm" })}</button>
                <input type="number" min="1" value="${qty}" />
                <button type="button" class="romix-icon-btn inc" aria-label="Aumentar">${window.romixIcon("Plus", { size: "sm" })}</button>
              </div>
              <div class="subtotal">$${subtotal.toLocaleString('es-AR')}</div>
              <button type="button" class="romix-icon-btn romix-icon-btn--soft remove" aria-label="Eliminar">${window.romixIcon("Trash2", { size: "sm" })}</button>
            </div>`;
          el.querySelector('.dec').addEventListener('click', ()=>handleQty(key, qty - 1));
          el.querySelector('.inc').addEventListener('click', ()=>handleQty(key, qty + 1));
          el.querySelector('input').addEventListener('change', (ev)=>handleQty(key, ev.target.value));
          el.querySelector('.remove').addEventListener('click', ()=>handleRemove(key));
          applyCartImage(el.querySelector('.cart-thumb img'), item, displayItem.name || 'Producto');
          list.appendChild(el);
        });
        if (orderBtn) {
          orderBtn.disabled = orderInProgress || inventoryLoading;
          orderBtn.setAttribute('aria-busy', inventoryLoading ? 'true' : 'false');
        }
        if (clearBtn) clearBtn.disabled = false;
      } else {
        if (orderBtn) orderBtn.disabled = true;
        if (clearBtn) clearBtn.disabled = true;
        list.innerHTML = orderStatus === 'success'
          ? renderSuccessState()
          : '<div class="cart-empty-state">Tu carrito esta vacio.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const clearBtn = document.getElementById('cart-clear-btn');
      const orderBtn = document.getElementById('order-btn');
      if (clearBtn) clearBtn.addEventListener('click', handleClear);
      if (orderBtn) orderBtn.addEventListener('click', handleOrder);
      renderCart();
      const inventory = window.romixInventory;
      const hasBackend = window.ROMIX_API_ENABLED === true
        || document.getElementById('preloaded-products')?.textContent.trim().startsWith('[');
      const sync = hasBackend && inventory && typeof inventory.syncFromApi === 'function'
        ? inventory.syncFromApi()
        : Promise.resolve({ ok: false });
      sync.finally(() => {
        inventoryLoading = false;
        renderCart();
      });
      window.addEventListener('romix:cart-storage-error', () => {
        showCartAlert('error', 'No pudimos guardar los cambios del carrito en este navegador. Revisa el almacenamiento disponible.');
      });
    });
  </script>
