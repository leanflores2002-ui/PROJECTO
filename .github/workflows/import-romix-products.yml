name: Import ROMIX products

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-products:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate legacy catalog
        run: python scripts/migration/import_products.py

      - name: Import products into Supabase/PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migration/import_products.py --apply
