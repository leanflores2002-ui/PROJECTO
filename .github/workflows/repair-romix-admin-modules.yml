name: Repair ROMIX admin modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-admin-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check and repair admin module schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migration/ensure_admin_modules.py --apply
